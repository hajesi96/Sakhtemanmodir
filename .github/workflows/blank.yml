name: Build SakhtemanModir APK

on:
  push:
    branches: [main, 'feature/v1.2.0-settings-payments']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk 'app/build/outputs/apk/debug/مدیر.apk'

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Modir-APK
          path: app/build/outputs/apk/debug/مدیر.apk
